<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Entre na sua conta NOME."
  >

  <title>Entrar — NOME</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="header auth-header">

    <a href="index.html" class="brand">
      NOME<span>.</span>
    </a>

    <a href="index.html" class="auth-back">
      ← Voltar para a loja
    </a>

  </header>


  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <main class="auth-main">

    <section class="auth-card">

      <div class="auth-heading">

        <span class="section-label">
          SUA CONTA
        </span>

        <h1>
          BEM-VINDO<br>
          <em>DE VOLTA.</em>
        </h1>

        <p>
          Entre para acompanhar seus pedidos e acessar sua conta.
        </p>

      </div>


      <!-- =================================================
           FORMULÁRIO
           ================================================= -->

      <form
        class="auth-form"
        onsubmit="loginUser(event)"
      >

        <div class="form-field">

          <label for="loginEmail">
            E-MAIL
          </label>

          <input
            id="loginEmail"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="seu@email.com"
            required
          >

        </div>


        <div class="form-field">

          <div class="form-label-row">

            <label for="loginPassword">
              SENHA
            </label>

            <a href="#" onclick="return false;">
              Esqueci minha senha
            </a>

          </div>

          <input
            id="loginPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            required
          >

        </div>


        <!-- Mensagem de erro/sucesso -->

        <div
          id="loginMessage"
          class="auth-message"
          style="display:none;"
        ></div>


        <button
          type="submit"
          class="button button-black auth-submit"
        >
          ENTRAR
        </button>

      </form>


      <!-- =================================================
           CADASTRO
           ================================================= -->

      <div class="auth-divider">
        <span>AINDA NÃO TEM UMA CONTA?</span>
      </div>

      <a
        href="cadastro.html"
        class="button button-outline auth-register"
      >
        CRIAR CONTA
      </a>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="auth-footer">

    <div class="footer-bottom">

      <span>
        © 2026 NOME.
      </span>

      <span>
        TODOS OS DIREITOS RESERVADOS.
      </span>

    </div>

  </footer>


  <!-- =====================================================
       SCRIPTS
       ===================================================== -->

  <script src="auth.js"></script>

</body>
</html>
