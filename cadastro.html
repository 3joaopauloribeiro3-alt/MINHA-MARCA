<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta — GUIP</title>

    <link rel="icon" href="logo.svg">
    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="simple-header">

    <a href="index.html">
        <img src="logo.svg" alt="GUIP">
    </a>

</header>


<main class="auth-page">

    <div class="auth-box">

        <span class="eyebrow">GUIP ACCOUNT</span>

        <h1>Criar conta</h1>

        <p class="auth-subtitle">
            Crie sua conta para comprar e acompanhar seus pedidos.
        </p>


        <form id="registerForm">

            <label>
                Nome
                <input
                    type="text"
                    id="name"
                    required
                    autocomplete="name"
                >
            </label>


            <label>
                E-mail
                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email"
                >
            </label>


            <label>
                Senha
                <input
                    type="password"
                    id="password"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >
            </label>


            <label>
                Confirmar senha
                <input
                    type="password"
                    id="confirmPassword"
                    minlength="6"
                    required
                    autocomplete="new-password"
                >
            </label>


            <button class="primary-button" type="submit">
                CRIAR CONTA
            </button>

        </form>


        <p id="registerMessage" class="form-message"></p>


        <div class="auth-links">

            <span>Já possui uma conta?</span>

            <a href="login.html">
                Entrar
            </a>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>

<script>

document
    .getElementById("registerForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirm =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("registerMessage");

        const button =
            this.querySelector("button");


        if (password !== confirm) {

            message.textContent =
                "As senhas não são iguais.";

            return;
        }


        button.disabled = true;
        button.textContent = "CRIANDO...";
        message.textContent = "";


        const result =
            await registerUser(name, email, password);


        if (!result.success) {

            message.textContent =
                result.error || "Não foi possível criar a conta.";

            button.disabled = false;
            button.textContent = "CRIAR CONTA";

            return;
        }


        if (result.session) {

            window.location.href = "conta.html";

        } else {

            message.textContent =
                "Conta criada! Verifique seu e-mail para confirmar o cadastro.";

            button.disabled = false;
            button.textContent = "CRIAR CONTA";
        }

    });

</script>

</body>
</html>
