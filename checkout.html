<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | GUIP</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .checkout-page {
            max-width: 1200px;
            margin: auto;
            padding: 70px 24px 110px;
        }

        .checkout-title {
            font-size: clamp(45px, 8vw, 80px);
            letter-spacing: -.06em;
            line-height: .9;
            margin-bottom: 60px;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 70px;
        }

        .checkout-section {
            border-top: 1px solid #ddd;
            padding-top: 28px;
            margin-bottom: 45px;
        }

        .checkout-section h2 {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .field input,
        .field select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            padding: 15px;
            background: #fff;
            font: inherit;
            outline: none;
        }

        .field input:focus,
        .field select:focus {
            border-color: #111;
        }

        .payment-option {
            border: 1px solid #ccc;
            padding: 20px;
            cursor: pointer;
        }

        .payment-option.active {
            border-color: #111;
        }

        .payment-option label {
            display: flex;
            gap: 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .checkout-summary {
            background: #f5f5f5;
            padding: 30px;
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .summary-title {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .summary-item {
            display: grid;
            grid-template-columns: 70px 1fr auto;
            gap: 14px;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
            align-items: center;
        }

        .summary-item img {
            width: 70px;
            height: 85px;
            object-fit: cover;
            background: #eee;
        }

        .summary-item-name {
            font-weight: 700;
            font-size: 14px;
        }

        .summary-item-meta {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .summary-item-price {
            font-size: 14px;
            white-space: nowrap;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            color: #555;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #111;
            font-size: 22px;
            font-weight: 800;
        }

        .checkout-button {
            width: 100%;
            border: 0;
            background: #111;
            color: #fff;
            padding: 18px;
            margin-top: 25px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: .04em;
        }

        .checkout-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .checkout-message {
            display: none;
            margin-top: 15px;
            padding: 14px;
            background: #eee;
            font-size: 14px;
        }

        .checkout-message.show {
            display: block;
        }

        @media(max-width: 850px) {
            .checkout-layout {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .checkout-summary {
                position: static;
            }
        }

        @media(max-width: 550px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .checkout-page {
                padding: 45px 20px 80px;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a href="index.html" class="brand-logo">
            <img src="logo.svg" alt="GUIP">
        </a>

        <nav class="main-nav">
            <a href="index.html#drop">DROP</a>
            <a href="index.html#shop">SHOP</a>
            <a href="sobre.html">A MARCA</a>
        </nav>

        <div class="header-actions">
            <a href="conta.html">Conta</a>
            <a href="index.html">Voltar</a>
        </div>

    </div>
</header>

<main class="checkout-page">

    <h1 class="checkout-title">CHECKOUT</h1>

    <div class="checkout-layout">

        <section>

            <div class="checkout-section">

                <h2>Dados de entrega</h2>

                <form id="checkoutForm">

                    <div class="form-grid">

                        <div class="field full">
                            <label for="fullName">Nome completo</label>
                            <input id="fullName" type="text" required>
                        </div>

                        <div class="field">
                            <label for="email">E-mail</label>
                            <input id="email" type="email" readonly>
                        </div>

                        <div class="field">
                            <label for="phone">Telefone</label>
                            <input id="phone" type="tel" required>
                        </div>

                        <div class="field">
                            <label for="cep">CEP</label>
                            <input id="cep" type="text" maxlength="9" required>
                        </div>

                        <div class="field">
                            <label for="state">Estado</label>
                            <input id="state" type="text" required>
                        </div>

                        <div class="field full">
                            <label for="city">Cidade</label>
                            <input id="city" type="text" required>
                        </div>

                        <div class="field">
                            <label for="street">Rua</label>
                            <input id="street" type="text" required>
                        </div>

                        <div class="field">
                            <label for="number">Número</label>
                            <input id="number" type="text" required>
                        </div>

                        <div class="field">
                            <label for="complement">Complemento</label>
                            <input id="complement" type="text">
                        </div>

                        <div class="field">
                            <label for="neighborhood">Bairro</label>
                            <input id="neighborhood" type="text" required>
                        </div>

                    </div>

                </form>

            </div>

            <div class="checkout-section">

                <h2>Pagamento</h2>

                <div class="payment-option active">
                    <label>
                        <input
                            type="radio"
                            name="payment"
                            value="pix"
                            checked
                        >
                        PIX
                    </label>

                    <p style="margin:12px 0 0 27px;color:#666;font-size:14px;">
                        O pagamento será realizado através do método PIX.
                    </p>
                </div>

            </div>

        </section>

        <aside class="checkout-summary">

            <div class="summary-title">Seu pedido</div>

            <div id="checkoutItems"></div>

            <div class="summary-line">
                <span>Subtotal</span>
                <strong id="checkoutSubtotal">R$ 0,00</strong>
            </div>

            <div class="summary-line">
                <span>Entrega</span>
                <strong id="checkoutShipping">A calcular</strong>
            </div>

            <div class="summary-total">
                <span>Total</span>
                <span id="checkoutTotal">R$ 0,00</span>
            </div>

            <button
                type="button"
                id="finishOrderButton"
                class="checkout-button"
            >
                FINALIZAR PEDIDO
            </button>

            <div id="checkoutMessage" class="checkout-message"></div>

        </aside>

    </div>

</main>

<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <img src="logo.svg" alt="GUIP">
            <p>Streetwear para quem não segue padrão.</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="produtos.js"></script>
<script src="carrinho.js"></script>
<script src="checkout.js"></script>

</body>
</html>
