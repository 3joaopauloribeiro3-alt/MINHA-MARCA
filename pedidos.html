<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Pedidos | GUIP</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .orders-page {
            max-width: 1100px;
            margin: auto;
            padding: 70px 24px 120px;
        }

        .orders-title {
            font-size: clamp(45px, 8vw, 80px);
            line-height: .9;
            letter-spacing: -.06em;
            margin-bottom: 60px;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .order-card {
            border: 1px solid #ddd;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .order-id {
            font-weight: 800;
            font-size: 16px;
        }

        .order-date {
            color: #777;
            font-size: 13px;
            margin-top: 7px;
        }

        .order-total {
            font-weight: 700;
        }

        .order-status {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: 8px 12px;
            background: #eee;
        }

        .order-link {
            display: inline-block;
            background: #111;
            color: #fff;
            text-decoration: none;
            padding: 12px 18px;
            font-size: 12px;
            font-weight: 700;
        }

        .empty-orders {
            padding: 70px 20px;
            text-align: center;
            background: #f5f5f5;
        }

        .empty-orders h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .empty-orders p {
            color: #666;
            margin-bottom: 25px;
        }

        .shop-link {
            display: inline-block;
            background: #111;
            color: #fff;
            padding: 15px 25px;
            text-decoration: none;
            font-weight: 700;
        }

        @media(max-width:700px) {
            .order-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .order-actions {
                width: 100%;
            }

            .order-link {
                display: block;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a href="index.html" class="brand-logo">
            <img src="logo.svg" alt="GUIP">
        </a>

        <nav class="main-nav">
            <a href="index.html#drop">DROP</a>
            <a href="index.html#shop">SHOP</a>
            <a href="sobre.html">A MARCA</a>
        </nav>

        <div class="header-actions">
            <a href="conta.html">Conta</a>
            <a href="index.html">Shop</a>
        </div>

    </div>
</header>

<main class="orders-page">

    <h1 class="orders-title">MEUS PEDIDOS</h1>

    <div id="ordersContainer">
        <p>Carregando pedidos...</p>
    </div>

</main>

<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <img src="logo.svg" alt="GUIP">
            <p>Streetwear para quem não segue padrão.</p>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="pedidos.js"></script>

</body>
</html>
