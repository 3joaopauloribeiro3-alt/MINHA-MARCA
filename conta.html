<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha conta — GUIP</title>

    <link rel="icon" href="logo.svg">
    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a class="brand" href="index.html">
            <img src="logo.svg" alt="GUIP">
        </a>

        <nav class="main-nav">

            <a href="index.html">DROP</a>
            <a href="index.html#shop">SHOP</a>
            <a href="sobre.html">A MARCA</a>

        </nav>

        <div class="header-actions">

            <a href="index.html">Loja</a>

            <a href="pedidos.html">Pedidos</a>

        </div>

    </div>

</header>


<main class="account-page">

    <div class="account-container">

        <div class="page-heading">

            <span class="eyebrow">GUIP ACCOUNT</span>

            <h1>Minha conta</h1>

            <p id="accountUserEmail"></p>

        </div>


        <div class="account-grid">

            <section class="account-card">

                <h2>Dados pessoais</h2>

                <form onsubmit="saveAccount(event)">

                    <label>
                        Nome

                        <input
                            id="accountName"
                            type="text"
                        >
                    </label>


                    <label>
                        E-mail

                        <input
                            id="accountEmail"
                            type="email"
                            readonly
                        >
                    </label>


                    <label>
                        Telefone

                        <input
                            id="accountPhone"
                            type="tel"
                        >
                    </label>


                    <button
                        type="submit"
                        class="primary-button"
                    >
                        SALVAR ALTERAÇÕES
                    </button>

                </form>


                <p id="accountMessage" class="form-message"></p>

            </section>


            <section class="account-card">

                <h2>Acesso rápido</h2>

                <a class="account-link" href="pedidos.html">
                    Meus pedidos →
                </a>

                <a
                    id="adminLink"
                    class="account-link"
                    href="admin.html"
                    style="display:none"
                >
                    Painel administrativo →
                </a>

                <button
                    class="secondary-button"
                    onclick="logoutAccount()"
                >
                    SAIR DA CONTA
                </button>

            </section>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="conta.js"></script>

</body>
</html>
